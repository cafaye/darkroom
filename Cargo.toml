[package]
name = "darkroom"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "cafaye darkroom — media service: signed uploads, tenant-scoped asset registry, variant generation"
license = "MIT"
repository = "https://github.com/cafaye/darkroom"
publish = false

[lib]
name = "darkroom"
path = "src/lib.rs"

[[bin]]
name = "darkroom"
path = "src/main.rs"

[features]
# The real object storage. Off by default so `cargo test` can never reach the
# network: the default build wires InMemoryObjectStore, and only the deployment
# image turns this on. See AGENTS.md "The storage boundary".
default = []
s3 = ["dep:aws-sdk-s3", "dep:aws-config"]
# A development-only HMAC token verifier. Refuses to start outside
# DARKROOM_ENV=development. See src/auth/mod.rs.
dev-auth = ["dep:hmac"]

[dependencies]
# --- HTTP ---
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "request-id", "limit"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
http = "1"

# --- errors ---
thiserror = "2"
anyhow = "1"

# --- serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- platform substrate ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# --- ids and time ---
uuid = { version = "1", features = ["v4", "serde"] }
# `time`, not `chrono`: sqlx's own `time` feature speaks it, the outbox envelope
# needs RFC3339 UTC, and it is already in the tree for sqlx so it is not an
# extra dependency. `serde-well-known` is what makes OffsetDateTime serialise as
# an RFC3339 string instead of a struct.
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde-well-known"] }

# --- database ---
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "uuid",
    "json",
    "time",
    "macros",
    "migrate",
] }

# --- storage ---
async-trait = "0.1"
bytes = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
base64 = "0.22"

# --- auth ---
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# --- image variants ---
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "gif",
] }

# --- s3 (feature = "s3") ---
# aws-config supplies the credential chain (env, profile, IMDS, container
# role) and aws-sdk-s3 the operations including presigning. Neither is a
# default feature: the default build cannot construct a real S3 client at all,
# which is what makes "tests never touch the network" a property of the
# dependency graph rather than a promise.
aws-config = { version = "1", optional = true, default-features = false, features = [
    "behavior-version-latest",
    "rt-tokio",
    "rustls",
] }
# Presigning is not a feature: `PresigningConfig` is part of the client in
# aws-sdk-s3 1.x, so a `presigning` feature name does not exist and asking for
# it is a hard resolve error rather than a silent no-op. `sigv4a` is what lets
# the bucket be a region placeholder and still presign correctly.
#
# THE EXACT PIN IS LOAD-BEARING. Do not widen it to "1" without re-running
# `cargo test --features s3` and reading the presigned-URL table in
# tests/storage_backends.rs.
#
# Two SDK changes in this area have broken Cloudflare R2, and both are invisible
# until a request reaches a bucket:
#
#   - Flexible checksums became `WhenSupported` by default, so the SDK attaches
#     a CRC-32 (and, in recent releases, CRC-64/NVME) `x-amz-checksum-*` header
#     to every PutObject and UploadPart whether or not the caller asked. R2's
#     compatibility table does not implement `x-amz-checksum-algorithm` on the
#     operations darkroom uses, and the equivalent change in
#     `@aws-sdk/client-s3` broke PutObject against R2 outright. darkroom pins
#     `RequestChecksumCalculation::WhenRequired` in
#     src/objectstore/s3_impl.rs so the default cannot reach the wire, and a
#     test asserts it on the built SdkConfig — but that test can only exist
#     because the types it names exist in this version.
#   - The checksum calculation internals moved around (`aws-smithy-checksums`,
#     `AwsChunkedBodyOptions`), and a version that emits `aws-chunked` framing
#     or a trailer for a presigned PUT produces a URL S3 and R2 both reject.
#
# A bump is fine. A bump without the table is how the next packet inherits this
# one.
aws-sdk-s3 = { version = "=1.150.0", optional = true, default-features = false, features = [
    "rt-tokio",
    "rustls",
    "sigv4a",
    "behavior-version-latest",
] }

# --- dev-auth feature ---
hmac = { version = "0.12", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }
# `tower::ServiceExt::oneshot` drives the router without binding a socket, so an
# HTTP test is a function call rather than a network round trip. This is the
# concrete reason no test in this repository can hit the network by accident.
tower = { version = "0.5", features = ["util"] }
http = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "uuid",
    "json",
    "time",
    "macros",
    "migrate",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
