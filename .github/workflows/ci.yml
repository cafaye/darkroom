---
# darkroom's CI. The shared half is kit's reusable workflow; the service half
# is here, and it is here because it is the part kit cannot own.
#
# ## The division, and why it falls where it does
#
#   ci       kit's reusable workflow, language: rust. Conventions, and the
#            coverage gate — the one check `bin/prime` does not have.
#   gate     `bin/prime --db` against a real Postgres. The three tiers.
#   contract cafaye.yml against core's schema, using cafaye/caf's own tool.
#
# `gate` cannot live in kit. kit's rust job is `cargo fetch`, `cargo fmt
# --check`, `cargo clippy --all-targets -- -D warnings`, `cargo test`, and a
# coverage step: the test command is hardcoded, there is no `services:` block,
# there is no `TEST_DATABASE_URL`, and there is no second feature set. Every
# one of those is a fact about *this* service — that its gate is a script, that
# its third tier needs a database, that its second tier needs `--features s3`.
# kit is config with no dependencies by design, so a job that calls one
# repository's `bin/prime` is not something kit can grow without becoming the
# thing it exists to prevent. Raised for the manager as a possible future
# `gate-command:` input; until it exists, the job is here.
#
# `contract` cannot live in kit either, for a sharper reason: it checks out
# `cafaye/caf` — a *different* cafaye repository — and runs their Go CLI
# against our manifest. A step that reaches into another cafaye repository is
# explicitly out of kit's scope.
#
# ## The thing this file exists to prevent
#
# `bin/prime` has three tiers and the third one does not run by default. Tier 6
# is `cargo test -- --ignored` against `TEST_DATABASE_URL`, and its tests are
# `#[ignore]`d, so a plain `cargo test` reports them as ignored and exits zero.
# A CI run that stops at tier 5 is a run that has never touched a database, and
# darkroom is a service whose entire job is putting bytes in one. So `gate` sets
# the environment and calls `bin/prime --db`, and `bin/tier-counts` reads the
# counts afterwards so a green run has to mean the database tests actually
# passed rather than merely did not fail.
#
# Tier 6 runs in PARALLEL, with no `--test-threads=1`, because each test applies
# the migrations into a schema of its own — see `tests/common/mod.rs` and
# `tests/schema_isolation.rs`. The flag used to be there because the suites
# shared one set of tables and each truncated them; the schemas are why it is
# not. That distinction matters for this file: `gate` provisions ONE postgres
# service for the whole job, so a suite that had quietly gone back to sharing
# tables would pass locally on a developer's eight cores and fail here for
# reasons this file cannot report, and a `--test-threads=1` reappearing in
# `bin/prime` would hide it. The tier-counts check below is what notices.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  # So a maintainer can run this by hand on a branch without pushing to it.
  # `bin/prime --db` against a service container is not something you can
  # reproduce from a laptop without Docker, and "it works on my machine" is not
  # evidence a gate ran.
  workflow_dispatch:

# Read-only, and the workflow takes no secrets at all. There is no `secrets:`
# block and no `secrets: inherit`, deliberately: darkroom's storage tests are
# credential-free by construction (presigning is local), so the only thing a
# credential here would buy is a secret at rest in repository settings. Adding
# one is a decision, not a chore.
permissions:
  contents: read

# A superseded push on the same ref makes the run moot, and both jobs are slow
# enough that the wasted minutes are real. Same policy kit uses.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `ci` and `gate` both compile the crate, on separate runners, so the suite is
# built twice per push. That is the cost of the shared half being shared rather
# than inlined, and it is the right trade: `gate` runs `bin/prime` — the command
# a developer runs, which kit cannot do — and `ci` brings the coverage gate and
# the conventions. Copying kit's steps into `gate` to save one build would put a
# duplicate of the shared workflow in this file, which is the drift kit exists
# to prevent.

jobs:
  # ---------------------------------------------------------------- shared half
  ci:
    name: ci (kit)
    uses: cafaye/kit/.github/workflows/ci.reusable.yml@master
    with:
      language: rust
      working-dir: .
      # Set even though kit's rust job does not read it yet: `dtolnay/rust-
      # toolchain@stable` is called with no `toolchain:` input, so the job runs
      # on floating stable regardless. The input is here so the moment kit
      # honours it, this repository is already pinned. The pin that is real
      # today is rust-toolchain.toml, which `gate` honours. See the report.
      versions: '{"rust":"1.95.0"}'
      # 50, against 53.73% measured line coverage on rustc 1.95.0 with default
      # features. A floor rather than a ratchet: it fails if coverage collapses
      # and stays out of the way of a legitimate change. kit's default is 0,
      # which fails nothing, and "a gate that can never fail is not a gate" is
      # kit's own rule. The number is not arbitrary — `--fail-under-lines 50`
      # was measured green and `--fail-under-lines 54` was measured red, so the
      # gate can actually fail.
      #
      # It measures less than it looks like it does, deliberately stated rather
      # than implied: kit runs `cargo llvm-cov` with default features, so the
      # s3 build is in the denominator and out of the numerator, and it runs
      # the same `cargo test` that ignores the 58 database tests, so
      # `store.rs` sits at 0.54%. What this number catches is the default suite
      # ceasing to run at all.
      coverage-fail-under: '50'

  # ------------------------------------------------------------------ the gate
  gate:
    name: gate (bin/prime --db)
    runs-on: ubuntu-24.04
    services:
      postgres:
        # The same image docker-compose.yml runs, so the database tier is
        # verified against the engine a developer verifies it against. Pinned
        # to a major, not a patch: a tighter pin here would be a database
        # version CI tests and the local stack does not.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: darkroom
          POSTGRES_PASSWORD: darkroom
          POSTGRES_DB: darkroom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U darkroom -d darkroom_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://darkroom:darkroom@localhost:5432/darkroom_test?sslmode=disable
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7

      - name: the pinned toolchain, and proof that it is in force
        # Not `dtolnay/rust-toolchain@stable`. rust-toolchain.toml in this
        # repository is the pin and `rustup` reads it, so CI and a worktree
        # cannot disagree about which rustc produced a green result. kit's job
        # cannot do this for itself — that is the kit gap named in the report.
        #
        # The expected version is read out of rust-toolchain.toml rather than
        # written here, so raising the pin is a one-file change and the check
        # follows it. What it buys is that "the build is pinned" is a fact this
        # job asserts, not a comment nobody re-reads.
        run: |
          set -euo pipefail
          rustup show active-toolchain
          rustc --version --verbose
          want="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          got="$(rustc --version | awk '{print $2}')"
          if [ -z "$want" ]; then
            echo "::error::rust-toolchain.toml has no channel. The pin is the pin; do not remove it." >&2
            exit 1
          fi
          if [ "$got" != "$want" ]; then
            echo "::error::rustc is $got but rust-toolchain.toml pins $want. The build is not pinned." >&2
            exit 1
          fi
          echo "pinned: rustc $got, host $(rustc -vV | sed -n 's/^host: //p')"

      - name: the gate
        # `bin/prime`, the same command a developer runs, with the flag that
        # forces the database tier. `tee` so the counts are in the log AND in
        # the next step; `set -o pipefail` because without it this pipeline
        # returns tee's exit code and a failing gate reads as a pass, which is
        # exactly how a broken packet reached master once (PLAN.md §1).
        run: |
          set -euo pipefail
          ./bin/prime --db 2>&1 | tee "$RUNNER_TEMP/prime.log"

      - name: the tiers actually ran
        # The gate exits zero when it is happy, and `cargo test` exits zero when
        # it ignored everything it could. Those are the same exit code, so this
        # reads the counts: 77 unit, 89 with s3, 9 R2/S3 behaviour-table rows,
        # and 58 database tests in each feature set. Without it a green badge
        # is a claim about a run that may never have happened.
        run: ./bin/tier-counts "$RUNNER_TEMP/prime.log"

      - name: Cargo.lock is the lockfile
        # Cheap, and it catches a class of drift that is otherwise invisible:
        # a dependency bump that resolves differently on the runner than it did
        # on the machine that committed it. The Dockerfile already treats
        # `--locked` as non-negotiable for the same reason.
        run: git diff --exit-code Cargo.lock

  # ----------------------------------------------------------------- contract
  contract:
    name: cafaye manifest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: check out caf
        # darkroom's own tree, into a subdirectory. This step is the reason
        # `contract` cannot move into kit: it reaches into another cafaye
        # repository, and kit's AGENTS.md puts that out of scope by name.
        uses: actions/checkout@v7
        with:
          repository: cafaye/caf
          path: caf
      - uses: actions/setup-go@v7
        with:
          # Pinned, because `go-version: stable` is a build that depends on
          # which toolchain the runner image cached.
          go-version: '1.26'
      - name: lint cafaye.yml against core's schema
        # The manifest is not this repository's to define. core owns the schema
        # and `caf` owns the validator, so the check is "run their tool" rather
        # than a copy of their rules that drifts.
        run: cd caf && go run ./cmd/caf contract lint ../cafaye.yml
