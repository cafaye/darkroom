---
# darkroom's CI. The shared half is kit's reusable workflow; the service half
# is here, and it is here because it is the part kit cannot own.
#
# ## The division, and why it falls where it does
#
#   ci       kit's reusable workflow, language: go. Conventions, and the
#            coverage gate — the one check `bin/prime` does not have.
#   gate     `bin/prime --db` against a real Postgres. The database tier, which
#            is the one that does not run without the flag.
#   contract cafaye.yml against core's schema, using cafaye/caf's own tool.
#
# `gate` cannot live in kit. The inputs `ci` above passes are the whole of the
# interface — a `language`, a `working-dir`, a `versions` map and a
# `coverage-fail-under` — and none of them is a command, a service container or
# an environment variable: the test command is kit's, there is no `services:`
# block, and nothing puts a `TEST_DATABASE_URL` in the runner's environment.
# Every one of those is a fact about *this* service — that its gate is a script
# (`bin/prime`), that the database tier needs a Postgres to talk to, and that a
# green default tier proves nothing about the tier that matters. kit is config
# with no dependencies by design, so a job that calls one repository's
# `bin/prime` is not something kit can grow without becoming the thing it exists
# to prevent. Raised for the manager as a possible future `gate-command:` input;
# until it exists, the job is here.
#
# `contract` cannot live in kit either, for a sharper reason: it checks out
# `cafaye/caf` — a *different* cafaye repository — and runs their Go CLI
# against our manifest. A step that reaches into another cafaye repository is
# explicitly out of kit's scope.
#
# ## The thing this file exists to prevent
#
# `bin/prime` has a default tier and a database tier, and the second one does not
# run by default. `./bin/prime` with no flag is green on a bare machine with no
# Postgres and no Docker, which is what makes it usable as a pre-commit hook and
# is exactly why it is not enough here: every database test calls
# `pgtest.Require`, which SKIPS at runtime with a named reason rather than
# failing. The default tier runs `go test ./...` with no `-v`, and `go test`
# discards a passing package's output entirely, so those `--- SKIP:` rows are
# invisible on that run — and Go has no `#[ignore]` marker to make a skip
# countable the way cargo's `ignored` count made one. A CI run of
# `./bin/prime` without the flag is a run that has never touched a database, and
# darkroom is a service whose entire job is putting bytes in one. So `gate` sets
# the environment and calls `bin/prime --db`, and `bin/tier-counts` reads the
# counts afterwards so a green run has to mean the database tests actually
# passed rather than merely did not fail.
#
# The database tier runs IN PARALLEL, with no `-p 1` and no serialisation flag,
# because each test applies the migrations into a schema of its own — see
# `internal/darkroomdb/pgtest`. A flag used to be there because the suites shared
# one set of tables and each truncated them; the schemas are why it is not, and
# `TestTheHarnessGivesEachTestItsOwnSchema` is the property itself: six
# goroutines, one row each, and each asserting it sees exactly ONE row rather
# than "each asserting it wrote its own" — a harness where every schema is the
# same schema satisfies the second and fails the first. That distinction matters
# for this file: `gate` provisions ONE postgres service for the whole job, so a
# suite that had quietly gone back to sharing tables would pass locally on a
# developer's eight cores and fail here for reasons this file cannot report, and
# a serialisation flag reappearing in `bin/prime` would hide it. The tier-counts
# check below is what notices.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  # So a maintainer can run this by hand on a branch without pushing to it.
  # `bin/prime --db` against a service container is not something you can
  # reproduce from a laptop without Docker, and "it works on my machine" is not
  # evidence a gate ran.
  workflow_dispatch:

# Read-only, and the workflow takes no secrets at all. There is no `secrets:`
# block and no `secrets: inherit`, deliberately: darkroom's storage tests are
# credential-free by construction (presigning is local), so the only thing a
# credential here would buy is a secret at rest in repository settings. Adding
# one is a decision, not a chore.
permissions:
  contents: read

# A superseded push on the same ref makes the run moot, and both jobs are slow
# enough that the wasted minutes are real. Same policy kit uses.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `ci` and `gate` both build the service, on separate runners, so the tree is
# built twice per push. That is the cost of the shared half being shared rather
# than inlined, and it is the right trade: `gate` runs `bin/prime` — the command
# a developer runs, which kit cannot do — and `ci` brings the coverage gate and
# the conventions. Copying kit's steps into `gate` to save one build would put a
# duplicate of the shared workflow in this file, which is the drift kit exists
# to prevent.

jobs:
  # ---------------------------------------------------------------- shared half
  ci:
    name: ci (kit)
    uses: cafaye/kit/.github/workflows/ci.reusable.yml@master
    with:
      language: go
      working-dir: .
      # Pinned, because `go-version: stable` is a build that depends on which
      # toolchain the runner image cached. The number is the one go.mod declares
      # and mise.toml pins, so raising it is a three-file change and this one
      # follows it.
      versions: '{"go":"1.26.1"}'
      # 50, against measured line coverage on the default suite. A floor rather
      # than a ratchet: it fails if coverage collapses and stays out of the way of
      # a legitimate change. kit's default is 0, which fails nothing, and "a gate
      # that can never fail is not a gate" is kit's own rule.
      #
      # NOT YET MEASURED FOR THE GO TREE, and that is stated rather than
      # implied. The 50 was the RUST tree's measured figure, carried across so
      # the floor is not silently dropped; `bin/prime` has no coverage step and
      # the Rust one lived in CI only. The first honest Go measurement is the
      # next thing to do with this number, and until then it is a floor that may
      # or may not be reachable.
      coverage-fail-under: '54'

  # ------------------------------------------------------------------ the gate
  gate:
    name: gate (bin/prime --db)
    runs-on: ubuntu-24.04
    services:
      postgres:
        # The same image docker-compose.yml runs, so the database tier is
        # verified against the engine a developer verifies it against. Pinned
        # to a major, not a patch: a tighter pin here would be a database
        # version CI tests and the local stack does not.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: darkroom
          POSTGRES_PASSWORD: darkroom
          POSTGRES_DB: darkroom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U darkroom -d darkroom_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://darkroom:darkroom@localhost:5432/darkroom_test?sslmode=disable
      # The LOGIN role, and `bin/prime --db` REFUSES TO START WITHOUT IT. One test in
      # the pgtest tier — `TestTheLoginRoleCanDoTheWork` — is only meaningful as
      # `darkroom_app`, because every other test in that tier is the owner role
      # talking to itself. The step above creates the role; this is where the gate
      # finds it.
      DARKROOM_DATABASE_URL: postgres://darkroom_app:darkroom@localhost:5432/darkroom_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Pinned to the number go.mod declares and mise.toml pins, rather than
          # to `stable`, because a build that depends on which toolchain the
          # runner image cached is not a pinned build.
          go-version: '1.26.1'

      - name: the pinned toolchain, and proof that it is in force
        # The Go tree has no `rust-toolchain.toml`, so the pin lives in go.mod and
        # mise.toml and this job asserts that the toolchain in force is the one
        # they declare. The expected version is READ OUT of go.mod rather than
        # written here, so raising the pin is a one-file change and the check
        # follows it — which is the property the Rust version of this step had
        # and the reason it existed.
        #
        # `go.mod` spells it `go 1.26.1` while `go version` prints `go1.26.1`,
        # so the dot is normalised rather than the comparison loosened.
        run: |
          set -euo pipefail
          go version
          want="$(sed -n 's/^go //p' go.mod | head -1)"
          got="$(go version | awk '{print $3}' | sed 's/^go//')"
          if [ -z "$want" ]; then
            echo "::error::go.mod has no go directive. The pin is the pin; do not remove it." >&2
            exit 1
          fi
          if [ "$got" != "$want" ]; then
            echo "::error::go is $got but go.mod declares $want. The build is not pinned." >&2
            exit 1
          fi
          mise_pinned="$(sed -n 's/^go = "\(.*\)"$/\1/p' mise.toml)"
          if [ "$mise_pinned" != "$want" ]; then
            echo "::error::mise.toml pins $mise_pinned but go.mod declares $want. Three files, one number." >&2
            exit 1
          fi
          echo "pinned: go $got, host $(go env GOOS)/$(go env GOARCH)"

      - name: the login role the RLS policies name
        # `migrations/0004_account_isolation.sql` does
        # `select cafaye.protect_table('assets', 'darkroom_app')` and
        # `grant select, insert, update, delete on outbox_events to darkroom_app`, so
        # the role has to EXIST before the gate runs any migration. Locally it does,
        # because kit's `templates/compose/postgres/initdb/10-cluster.sh` provisions
        # two roles per service from one `KIT_POSTGRES_DATABASES` entry — `<svc>`
        # owning the database and `<svc>_app` owning nothing.
        #
        # HERE IT DID NOT, and the gap was invisible rather than loud. The service
        # container is a bare `postgres:17-alpine`, which creates only `POSTGRES_USER`,
        # so `TestTheLoginRoleCanDoTheWork` SKIPPED on every CI run, `bin/tier-counts`
        # counted 14 of 15, and the job that exists to hold this service to its
        # contract was itself failing a floor nothing could satisfy. The skip is
        # honest, which is exactly what made it survivable: nothing ever reported a
        # missing role, and one test — the only one proving the LOGIN role can do the
        # work — never ran anywhere.
        #
        # The role attributes are COPIED from `10-cluster.sh` rather than invented:
        # NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION, plus the membership of
        # the owner. `GRANT darkroom_app TO darkroom` matters as much as the CREATE —
        # migrations run as `darkroom`, and a login role the owner is not a member of
        # could not be granted anything.
        #
        # `docker exec` AND NOT A BARE `psql`, because the server is a SERVICE
        # CONTAINER and the client is a question about the runner image. GitHub's
        # ubuntu images happen to ship `postgresql-client` today, so a bare `psql`
        # would very likely work and would very quietly stop working when the runner
        # image changed. `job.services.postgres.id` is the container the healthcheck
        # above already proved is accepting connections, and `docker` is a given on a
        # runner. Both ends of the connection are then facts this file can see.
        #
        # This is also the step that makes `NOBYPASSRLS` worth checking. It is NOT
        # spelled above because kit does not spell it and matching kit is the
        # requirement; Postgres grants it to nothing by default, and
        # `TestTheLoginRoleCanDoTheWork` is what would catch an image that granted it
        # by default.
        run: |
          set -euo pipefail
          pg="${{ job.services.postgres.id }}"
          docker exec -i "$pg" psql -v ON_ERROR_STOP=1 -U darkroom -d darkroom_test <<'SQL'
          CREATE ROLE darkroom_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION
            PASSWORD 'darkroom';
          GRANT darkroom_app TO darkroom;
          -- The owner must NOT be a superuser: superusers bypass FORCE ROW LEVEL
          -- SECURITY, which is the property the tenancy tier exists to prove.
          -- The service container creates POSTGRES_USER as a superuser, so
          -- demote it here. NOSUPERUSER keeps CREATE on its own database.
          ALTER ROLE darkroom NOSUPERUSER NOBYPASSRLS;
          SQL
          echo "roles now in darkroom_test:"
          docker exec "$pg" psql -U darkroom -d darkroom_test -Atc \
            "select rolname from pg_roles where rolname like 'darkroom%' order by 1"

      - name: the gate
        # `bin/prime`, the same command a developer runs, with the flag that
        # forces the database tier. `tee` so the counts are in the log AND in
        # the next step; `set -o pipefail` because without it this pipeline
        # returns tee's exit code and a failing gate reads as a pass, which is
        # exactly how a broken packet reached master once (PLAN.md §1).
        run: |
          set -euo pipefail
          ./bin/prime --db 2>&1 | tee "$RUNNER_TEMP/prime.log"

      - name: the tiers actually ran
        # The gate exits zero when it is happy, and `go test` exits zero for a
        # package with no test files in it. Those are the same exit code, so this
        # reads the counts: 24 variant checks with no database, and 17 harness +
        # 39 service + 34 httpapi against one. Without it a green badge is a
        # claim about a run that may never have happened.
        #
        # These four numbers are `VARIANT_TESTS`, `PGTEST_DB_TESTS`,
        # `SERVICE_DB_TESTS` and `HTTPAPI_TESTS` in `bin/tier-counts`, restated
        # here so a reader of this file can see what the step is checking without
        # opening the script. Which is exactly why they were WRONG until now — they
        # read 29 service and 19 httpapi, the figures as of the packet that wrote
        # this step, and three later packets each raised a floor without coming
        # back here. The constants are what the step runs on and they were right;
        # this comment was a copy nobody owned. It is the same defect as the
        # `tests/common/mod.rs` tier list this file used to carry, one level down:
        # a second inventory of a number, kept by hand, drifting from the first.
        #
        # A copy is only safe where something re-derives it, and nothing does here,
        # so the honest form is a copy that says where it came from — which is why
        # the constant names are named above. Changing a floor means changing
        # `bin/tier-counts`; changing one of these four means changing nothing but
        # this comment, and if the two disagree, the constants are right.
        run: ./bin/tier-counts "$RUNNER_TEMP/prime.log"

      - name: go.sum is the lockfile
        # Cheap, and it catches a class of drift that is otherwise invisible: a
        # dependency bump that resolves differently on the runner than it did on
        # the machine that committed it. `bin/prime`'s regenerate step runs
        # `go generate` with `GOFLAGS=-mod=mod`, which is the one place in this
        # repository that could rewrite a module file, so this is the check that
        # says it did not.
        run: git diff --exit-code go.mod go.sum

  # ----------------------------------------------------------------- contract
  contract:
    name: cafaye manifest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: check out caf
        # darkroom's own tree, into a subdirectory. This step is the reason
        # `contract` cannot move into kit: it reaches into another cafaye
        # repository, and kit's AGENTS.md puts that out of scope by name.
        uses: actions/checkout@v7
        with:
          repository: cafaye/cafe
          path: cafe
      - uses: actions/setup-go@v7
        with:
          # Pinned, because `go-version: stable` is a build that depends on
          # which toolchain the runner image cached.
          go-version: '1.26'
      - name: lint cafaye.yml against core's schema
        # The manifest is not this repository's to define. core owns the schema
        # and `caf` owns the validator, so the check is "run their tool" rather
        # than a copy of their rules that drifts.
        run: cd cafe && go run ./cmd/cafe contract lint ../cafaye.yml
