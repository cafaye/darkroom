# tenancy.yml — what darkroom declares about its own account boundary.
#
# Checked by cafaye/core's contract harness:
#
#     /Users/kaka/Code/any/moon/cafaye/core/harness/bin/tenancy-check .
#
# darkroom is the clean example `core/docs/tenancy.md` names: `assets` and
# `asset_variants` carry `account_id uuid not null`, and the boundary is drawn
# in TWO places that are declared separately below — the application's
# statements (`entryPoints`) and Postgres' policies (`rls`).
#
# # THE GO TREE DRAWS THE BOUNDARY DIFFERENTLY THAN THE RUST TREE DID, AND THIS
# # FILE SAYS SO RATHER THAN PRETENDING OTHERWISE.
#
# `core/docs/tenancy.md` §"Why this file exists" quotes the Rust store's shape —
# `where id = $1 and account_id = $2`, every query carrying its own predicate.
# The Go tree deliberately does NOT: `internal/service/store.go`'s header says
# writing the predicate by hand "would be belt-and-braces at the cost of being
# WRONG in a way RLS is not: it is a second source of truth for the tenant".
# Instead every store function takes a `pgx.Tx` that `darkroomdb.InAccountTx`
# opened with `cafaye.account_id` set transaction-local, and the policies in
# `migrations/0004_account_isolation.sql` do the filtering. So the line that
# carries `account_id` for a statement is not a predicate in that statement —
# it is the column list the statement reads the tenancy column through, or the
# values line that writes it. Each entry point below names which.
version: 1
service: darkroom

# This service holds other people's accounts' media and reads and writes their
# rows. The table below is the audit log of a security boundary, so `false`
# here would be a lie rather than a declaration.
accountScoped: true

scope:
  # The column every account-scoped statement in this service scopes by.
  # Spelled `account_id` because that is what the migrations call it.
  key: account_id
  # FILES, NOT DIRECTORIES, for the reason `cafaye/identity/tenancy.yml` gives:
  # a directory would drag in `_test.go` fixtures and the service layer's log
  # keys, which carry the word and are not entry points into anything.
  #
  # `internal/service/store.go` is the whole of the SQL: every account-scoped
  # statement in this service is a function in that file, and the file's own
  # header says why there is no other.
  #
  # `migrations` is DELIBERATELY NOT HERE, and the reason is the two-list split
  # `core/docs/tenancy.md` §"Why `rls.sources` is a second list" exists for:
  # this list is where the account-scoped STATEMENTS are, `rls.sources` below
  # is where the DDL is. Scanning the substrate's plpgsql bodies as statements
  # is what produces the three `tenancy.undeclared-entry` findings naming
  # `pg_attribute` — a template's guard read as a statement reaching a
  # customer's rows, on a database that is correctly isolated. That is a
  # documented scanner gap (`core/docs/tenancy.md` §"What this does not
  # prove"), it is measured and named in REPORT-darkroom-tenancy-01.md, and
  # the DDL it lives in is read by `rls.sources` instead.
  sources:
    - internal/service/store.go

rls:
  # True, and it is the reason this file exists rather than saying `false` and
  # listing nothing: migration 0004 makes Postgres refuse a cross-account read.
  databaseEnforced: true
  # The template's own function, and not a spelling of it: `protect_table`
  # writes every predicate as `account_id = (select cafaye.current_account_id())`,
  # so naming anything else here would make `tenancy.rls-permissive` correct.
  # The WRAPPED spelling is what makes the policies evaluate once per statement
  # rather than once per row; the schema's pattern requires the bare name
  # ending in `()` and cannot express the wrap.
  identity: cafaye.current_account_id()
  # The DDL tree, and separate from `scope.sources` above because the two checks
  # read different things: this one reads `create policy` and
  # `alter table … row level security` (resolved through `protect_table`),
  # the other reads statements.
  sources:
    - migrations
  # Exactly two tables, and the count is the arithmetic of the migration:
  # `0004_account_isolation.sql` makes exactly two `select cafaye.protect_table(...)`
  # calls, at lines 999 and 1000. Each call is the enable bit, the FORCE bit
  # and four policies named `<table>_cafaye_{select,insert,update,delete}`.
  #
  # `idempotency_keys` and `outbox_events` are DELIBERATELY NOT HERE. They
  # carry no `account_id` column and no policy — `idempotency_keys` is scoped
  # by `principal_key` (`user_id:account_id` as one opaque string) and
  # `outbox_events` is the service's own outbox, drained by its own code.
  # Declaring them would name a boundary Postgres does not draw.
  tables:
    - table: assets
      forced: true
      policies:
        - name: assets_cafaye_select
          command: select
          clause: using
          roles: [darkroom, darkroom_app]
          constrained:
            file: migrations/0004_account_isolation.sql
            line: 999
        - name: assets_cafaye_insert
          command: insert
          clause: with check
          roles: [darkroom, darkroom_app]
          constrained:
            file: migrations/0004_account_isolation.sql
            line: 999
        - name: assets_cafaye_update
          command: update
          clause: using
          roles: [darkroom, darkroom_app]
          constrained:
            file: migrations/0004_account_isolation.sql
            line: 999
        - name: assets_cafaye_delete
          command: delete
          clause: using
          roles: [darkroom, darkroom_app]
          constrained:
            file: migrations/0004_account_isolation.sql
            line: 999
    - table: asset_variants
      forced: true
      policies:
        - name: asset_variants_cafaye_select
          command: select
          clause: using
          roles: [darkroom, darkroom_app]
          constrained:
            file: migrations/0004_account_isolation.sql
            line: 1000
        - name: asset_variants_cafaye_insert
          command: insert
          clause: with check
          roles: [darkroom, darkroom_app]
          constrained:
            file: migrations/0004_account_isolation.sql
            line: 1000
        - name: asset_variants_cafaye_update
          command: update
          clause: using
          roles: [darkroom, darkroom_app]
          constrained:
            file: migrations/0004_account_isolation.sql
            line: 1000
        - name: asset_variants_cafaye_delete
          command: delete
          clause: using
          roles: [darkroom, darkroom_app]
          constrained:
            file: migrations/0004_account_isolation.sql
            line: 1000

# The declared enumeration: one entry point per account-scoped statement in
# `internal/service/store.go`. The two inserts in that file are absent by the
# format's own rule — an insert creates a row in the account the caller is
# already acting as, so it is not a place a cross-tenant leak can happen.
#
# Each entry point is proved three ways by `internal/service/tenancy_test.go`:
# a transaction with NO identity reads zero rows, a VALID identity for another
# account reads zero rows indistinguishable from nonexistence, and the account's
# OWN identity reads its own rows with a column read off the row. The third arm
# is the control — a suite that returns nothing to everybody passes the first
# two for free.
entryPoints:
  # The duplicate-upload pre-check: a select on assets by checksum.
  - id: asset-find-by-checksum
    operation: select
    subject: assets
    enforced:
      # The select list every asset read returns, and the column the policy
      # filters on. The statement itself (`where checksum = $1`) carries no
      # `account_id` predicate by design — see the header above.
      mechanism: query-filter
      file: internal/service/store.go
      line: 64
    negative:
      asserts: absent
      cases:
        # ARM ONE, no identity — the state a transaction that never called
        # `cafaye.begin_account` is in. `current_account_id()` reads NULL,
        # which matches no row under FORCE RLS.
        - id: no-identity
          asserts: absent
          expects: noIdentity
          file: internal/service/tenancy_test.go
          line: 123
        # ARM TWO, another account's VALID identity. The arm with the
        # information in it: the credential is real and belongs to somebody
        # else, and the result is indistinguishable from a checksum nobody
        # uploaded.
        - id: other-account
          asserts: absent
          expects: otherAccount
          file: internal/service/tenancy_test.go
          line: 136
        # ARM THREE, its own account: its own row, with the checksum read off
        # it.
        - id: own-account
          asserts: present
          expects: Checksum
          file: internal/service/tenancy_test.go
          line: 149

  # The fetch-by-id every id-scoped path goes through. `pgx.ErrNoRows` is the
  # 404 and it covers "no such asset" and "not yours" identically.
  - id: asset-find
    operation: select
    subject: assets
    enforced:
      mechanism: query-filter
      file: internal/service/store.go
      line: 64
    negative:
      asserts: absent
      cases:
        - id: no-identity
          asserts: absent
          expects: ErrNoRows
          file: internal/service/tenancy_test.go
          line: 171
        - id: other-account
          asserts: absent
          expects: ErrNoRows
          file: internal/service/tenancy_test.go
          line: 185
        - id: own-account
          asserts: present
          expects: Checksum
          file: internal/service/tenancy_test.go
          line: 202

  # The compare-and-set that completes an upload: `pending` → `ready`, an
  # update on assets. A denied write is never proved by the write alone — a
  # zero row count is also what a write that found nothing to do returns — so
  # both denial arms are paired with a read of the row they were aimed at.
  - id: asset-mark-ready
    operation: update
    subject: assets
    enforced:
      mechanism: query-filter
      file: internal/service/store.go
      line: 64
    negative:
      asserts: absent
      cases:
        - id: no-identity
          asserts: absent
          expects: assertUnchanged
          file: internal/service/tenancy_test.go
          line: 233
        - id: other-account
          asserts: absent
          expects: assertUnchanged
          file: internal/service/tenancy_test.go
          line: 249
        - id: own-account
          asserts: present
          expects: Status
          file: internal/service/tenancy_test.go
          line: 261

  # The failure path's compare-and-set: `pending` → `failed`, an update on
  # assets. Same shape as markReady, same pairing.
  - id: asset-mark-failed
    operation: update
    subject: assets
    enforced:
      mechanism: query-filter
      file: internal/service/store.go
      line: 64
    negative:
      asserts: absent
      cases:
        - id: no-identity
          asserts: absent
          expects: assertUnchanged
          file: internal/service/tenancy_test.go
          line: 288
        - id: other-account
          asserts: absent
          expects: assertUnchanged
          file: internal/service/tenancy_test.go
          line: 304
        - id: own-account
          asserts: present
          expects: Status
          file: internal/service/tenancy_test.go
          line: 316

  # The account's own page: a cursor-paginated select on assets.
  - id: asset-list
    operation: select
    subject: assets
    enforced:
      mechanism: query-filter
      file: internal/service/store.go
      line: 64
    negative:
      asserts: absent
      cases:
        - id: no-identity
          asserts: absent
          expects: noIdentity
          file: internal/service/tenancy_test.go
          line: 343
        # Bob's page holds his own row and none of alice's — the arm that
        # catches a list that forgot its scope and returned the whole table.
        - id: other-account
          asserts: absent
          expects: otherAccount
          file: internal/service/tenancy_test.go
          line: 356
        - id: own-account
          asserts: present
          expects: Checksum
          file: internal/service/tenancy_test.go
          line: 369

  # The delete path's key read: a select over assets and asset_variants for
  # one asset's storage keys.
  - id: asset-storage-keys
    operation: select
    subject: assets
    enforced:
      mechanism: query-filter
      file: internal/service/store.go
      line: 64
    negative:
      asserts: absent
      cases:
        - id: no-identity
          asserts: absent
          expects: noIdentity
          file: internal/service/tenancy_test.go
          line: 392
        - id: other-account
          asserts: absent
          expects: otherAccount
          file: internal/service/tenancy_test.go
          line: 405
        - id: own-account
          asserts: present
          expects: StorageKey
          file: internal/service/tenancy_test.go
          line: 418

  # The delete, which is the one that would end a customer's data. Denied by
  # the policy's `using` clause: zero rows, no error, and the paired read is
  # what tells a refusal from a no-op.
  - id: asset-delete
    operation: delete
    subject: assets
    enforced:
      mechanism: query-filter
      file: internal/service/store.go
      line: 64
    negative:
      asserts: absent
      cases:
        - id: no-identity
          asserts: absent
          expects: assertUnchanged
          file: internal/service/tenancy_test.go
          line: 446
        - id: other-account
          asserts: absent
          expects: assertUnchanged
          file: internal/service/tenancy_test.go
          line: 462
        - id: own-account
          asserts: present
          expects: ownAccount
          file: internal/service/tenancy_test.go
          line: 474

  # One asset's variants: a select on asset_variants.
  - id: variant-list
    operation: select
    subject: asset_variants
    enforced:
      # The variant select list, and the column the policy filters on.
      mechanism: query-filter
      file: internal/service/store.go
      line: 67
    negative:
      asserts: absent
      cases:
        - id: no-identity
          asserts: absent
          expects: noIdentity
          file: internal/service/tenancy_test.go
          line: 500
        - id: other-account
          asserts: absent
          expects: otherAccount
          file: internal/service/tenancy_test.go
          line: 513
        - id: own-account
          asserts: present
          expects: Kind
          file: internal/service/tenancy_test.go
          line: 526
