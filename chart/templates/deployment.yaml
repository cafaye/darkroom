apiVersion: apps/v1
kind: Deployment
metadata:
  name: darkroom
  labels:
    app.kubernetes.io/name: darkroom
    app.kubernetes.io/instance: darkroom
    app.kubernetes.io/managed-by: cafe
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: darkroom
      app.kubernetes.io/instance: darkroom
  template:
    metadata:
      labels:
        app.kubernetes.io/name: darkroom
        app.kubernetes.io/instance: darkroom
        app.kubernetes.io/managed-by: cafe
    spec:
      imagePullSecrets:
        - name: {{ .Values.imagePullSecrets }}
      containers:
        - name: darkroom
          # THE IMAGE REFERENCE, AND WHY IT IS CONDITIONAL. `repository@digest`
          # whenever a digest is committed (see values.yaml: a digest cannot
          # move, so a new build is a textual diff Argo syncs); `repository:tag`
          # until the first publish, because this chart has never published and
          # an empty digest would otherwise render `repository@` — a pod in
          # image-pull failure. gateway's generated-chart successor renders the
          # digest unconditionally, and carries a real one; the day this chart's
          # first publish lands, the committed digest makes the first branch the
          # live one. `cafe gen chart` must reproduce this conditional on
          # regenerate: the digest half of `image:` is deploy-time state, not a
          # manifest fact.
          {{- if .Values.image.digest }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
          env:
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
